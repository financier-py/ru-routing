[project]
name = "ru-routing"
version = "0.1.0"
description = "Routing lists for Russia: what doesn't open without a tunnel"
requires-python = ">=3.11"
license = "MIT"

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ru_routing"]

[tool.ruff]
line-length = 110
